# electron-builder configuration (NSIS installer). Build with `npm run dist` at the repo root.
appId: com.divilight.lolvodreview
productName: LoL VOD Review
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  # LGPL FFmpeg sidecar (BtbN win64-lgpl, fetched by tools/fetch-ffmpeg.ps1). Never bundle GPL builds or libobs.
  - from: ../../tools/bin/ffmpeg.exe
    to: ffmpeg.exe
  # Recorder sidecar (packages/recorder, `cargo build --release` first).
  - from: ../../packages/recorder/target/release/lvr-recorder.exe
    to: lvr-recorder.exe
asar: true
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
  # no spaces: GitHub turns them into dots and latest.yml would point at a missing file
  artifactName: LoL-VOD-Review-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LoL VOD Review
# in-app updates (electron-updater) read latest.yml from GitHub Releases; CI uploads it
publish:
  provider: github
  owner: nelcolon
  repo: lol-vod-review
electronVersion: 45.1.0
