# Builds the Windows installer and publishes a GitHub release when a v* tag is pushed
# (`npm run release` tags the current version). Can also be run by hand to test the build.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/recorder

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match apps/desktop/package.json version $version"
          }

      - name: FFmpeg (LGPL)
        shell: pwsh
        run: ./tools/fetch-ffmpeg.ps1

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run build -w packages/schema -w packages/core
          npm run typecheck
          npm test
          cargo test --release --manifest-path packages/recorder/Cargo.toml

      - name: Build installer
        run: npm run dist

      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($prev) { "$prev..$tag" } else { $tag }
          $changes = git log --no-merges --pretty="- %s" $range
          $notes = @(
            '## Download'
            ''
            'Download **LoL VOD Review-Setup-' + $tag.TrimStart('v') + '.exe** below and run it. It installs for your user only (no admin needed).'
            'The installer is not code-signed yet, so Windows SmartScreen may warn: click **More info** → **Run anyway**.'
            ''
            '## Changes'
            ''
          ) + $changes
          $notes -join "`n" | Out-File -Encoding utf8 notes.md
          $exe = Get-ChildItem apps/desktop/release/*.exe | Select-Object -First 1
          gh release create $tag $exe.FullName --title "LoL VOD Review $($tag.TrimStart('v'))" --notes-file notes.md
